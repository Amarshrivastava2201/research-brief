<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Squircle with Neon Border -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="#09090b" stroke="#06b6d4" stroke-width="2" stroke-opacity="0.6" />

  <!-- Research Document Outline -->
  <path d="M18 16 H36 L46 26 V48 H18 Z" fill="url(#cardGrad)" stroke="#3f3f46" stroke-width="2.2" stroke-linejoin="round" />
  <path d="M36 16 V26 H46" fill="none" stroke="#3f3f46" stroke-width="2.2" stroke-linejoin="round" />

  <!-- Neon Fast Lines on Document -->
  <line x1="24" y1="38" x2="32" y2="38" stroke="#71717a" stroke-width="2" stroke-linecap="round" />
  <line x1="24" y1="42" x2="28" y2="42" stroke="#71717a" stroke-width="2" stroke-linecap="round" />

  <!-- Glowing Electric Neon Synthesis Bolt -->
  <path d="M35 22 L24 35 H33 L30 45 L41 32 H32 Z" fill="url(#neonCyan)" filter="url(#neonGlow)" />
</svg>